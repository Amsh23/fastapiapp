name: Meow API

on:
  workflow_dispatch:
  repository_dispatch:
    types: [meow]
  push:
    paths:
      - "meow.py"
      - ".github/workflows/meow.yml"

permissions:
  contents: read

jobs:
  meow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Meow
        run: python meow.py
