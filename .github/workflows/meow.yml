name: Meow API

on:
  workflow_dispatch:
  repository_dispatch:
    types: [meow]
  push:
    paths:
      - "meow.py"
      - ".github/workflows/meow.yml"

permissions:
  contents: read
  actions: read

jobs:
  meow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Meow Engine and save JSON
        run: python meow.py > meow.json

      - name: Upload JSON result
        uses: actions/upload-artifact@v4
        with:
          name: meow-result
          path: meow.json
          if-no-files-found: error
          retention-days: 1
